<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430" role="img" aria-label="从 USB 到 root 与 Bootloader 解锁">
<defs>
<filter id="shadow" x="-10%" y="-15%" width="125%" height="135%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243957" flood-opacity=".07"/></filter>
<marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.7"/></marker>
<marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#00866f" stroke-width="1.7"/></marker>
<marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7c3aed" stroke-width="1.5"/></marker>
<marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#b76c0b" stroke-width="1.5"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f4f7fb"/>
<style>text{font-family:DejaVu Sans, Droid Sans Fallback, sans-serif;fill:#16263e;}</style>
<text x="60" y="68" font-size="38" font-weight="700">从 USB 到 root 与 Bootloader 解锁</text><text x="62" y="110" font-size="22" fill="#536580" style="fill:#536580">小度智能屏 1S · XDH-29-B1 · 按本机实测过程绘制 · 2026-10-23</text><rect x="60" y="145" width="1480" height="53" rx="18" fill="#e7f4ef"/><text x="86" y="180" font-size="26" fill="#00866f" style="fill:#00866f" font-weight="700">实际顺序：META root → 正常系统 root → 原生 Magisk → 真正 BL 解锁</text><g data-card="抓住 USB 启动窗口（Preloader）" data-box="60,220,1010,128"><rect x="60" y="220" width="1010" height="128" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M63 242V326" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><circle cx="103" cy="263" r="23" fill="#2563eb"/><text x="103" y="271" font-size="23" fill="white" style="fill:white" font-weight="700" text-anchor="middle">1</text><text x="142" y="262" font-size="27" font-weight="700">抓住 USB 启动窗口（Preloader）</text><text x="142" y="298" font-size="23" fill="#536580" style="fill:#536580">先连数据线，再接原装电源；电脑等待 READY</text><text x="142" y="331" font-size="23" fill="#536580" style="fill:#536580">在 Android 启动前发送模式选择指令</text></g><path d="M565 351V370" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><g data-card="METAMETA → META 维护模式" data-box="60,373,1010,128"><rect x="60" y="373" width="1010" height="128" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M63 395V479" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><circle cx="103" cy="416" r="23" fill="#2563eb"/><text x="103" y="424" font-size="23" fill="white" style="fill:white" font-weight="700" text-anchor="middle">2</text><text x="142" y="415" font-size="27" font-weight="700">METAMETA → META 维护模式</text><text x="142" y="451" font-size="23" fill="#536580" style="fill:#536580">ADB 可进入 uid=0 的 root shell</text><text x="142" y="484" font-size="23" fill="#536580" style="fill:#536580">先获得维护权限，读取本机必要材料</text></g><path d="M565 504V523" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><g data-card="把正常系统的 ADB 控制接通" data-box="60,526,1010,128"><rect x="60" y="526" width="1010" height="128" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M63 548V632" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><circle cx="103" cy="569" r="23" fill="#2563eb"/><text x="103" y="577" font-size="23" fill="white" style="fill:white" font-weight="700" text-anchor="middle">3</text><text x="142" y="568" font-size="27" font-weight="700">把正常系统的 ADB 控制接通</text><text x="142" y="604" font-size="23" fill="#536580" style="fill:#536580">写入自己的 ADB 公钥，正常启动后通过认证</text><text x="142" y="637" font-size="23" fill="#536580" style="fill:#536580">后续启用认证无线 ADB，日常减少 USB 依赖</text></g><path d="M565 657V676" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><g data-card="通过原厂 bdft 取得正常系统 root" data-box="60,679,1010,128"><rect x="60" y="679" width="1010" height="128" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M63 701V785" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><circle cx="103" cy="722" r="23" fill="#2563eb"/><text x="103" y="730" font-size="23" fill="white" style="fill:white" font-weight="700" text-anchor="middle">4</text><text x="142" y="721" font-size="27" font-weight="700">通过原厂 bdft 取得正常系统 root</text><text x="142" y="757" font-size="23" fill="#536580" style="fill:#536580">工厂测试服务以 root 执行音频测试配置命令</text><text x="142" y="790" font-size="23" fill="#536580" style="fill:#536580">利用这个入口调用维护脚本；正常系统也能执行 uid=0</text></g><path d="M565 810V829" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/><g data-card="修补 boot，让 Magisk 原生开机" data-box="60,832,1010,128"><rect x="60" y="832" width="1010" height="128" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M63 854V938" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><circle cx="103" cy="875" r="23" fill="#2563eb"/><text x="103" y="883" font-size="23" fill="white" style="fill:white" font-weight="700" text-anchor="middle">5</text><text x="142" y="874" font-size="27" font-weight="700">修补 boot，让 Magisk 原生开机</text><text x="142" y="910" font-size="23" fill="#536580" style="fill:#536580">匹配官方 1.68.2；修补 boot 并处理 AVB1 签名</text><text x="142" y="943" font-size="23" fill="#536580" style="fill:#536580">先验证独立救援；随后 su、模块、Zygisk 随开机工作</text></g><path d="M565 963V982" fill="none" stroke="#00866f" stroke-width="3" marker-end="url(#teal)"/><g data-card="已有 root → 生成有效的 BL 解锁配置" data-box="60,985,1010,128"><rect x="60" y="985" width="1010" height="128" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M63 1007V1091" stroke="#00866f" stroke-width="6" stroke-linecap="round"/><circle cx="103" cy="1028" r="23" fill="#00866f"/><text x="103" y="1036" font-size="23" fill="white" style="fill:white" font-weight="700" text-anchor="middle">6</text><text x="142" y="1027" font-size="27" font-weight="700">已有 root → 生成有效的 BL 解锁配置</text><text x="142" y="1063" font-size="23" fill="#536580" style="fill:#536580">临时内核模块调用原厂 HACC，重算 seccfg 校验</text><text x="142" y="1096" font-size="23" fill="#536580" style="fill:#536580">锁状态 1→3；写首扇区 512 字节，实际改变 33 字节</text></g><path d="M565 1116V1135" fill="none" stroke="#00866f" stroke-width="3" marker-end="url(#teal)"/><g data-card="原厂启动器与 Android 双重核验" data-box="60,1138,1010,128"><rect x="60" y="1138" width="1010" height="128" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M63 1160V1244" stroke="#00866f" stroke-width="6" stroke-linecap="round"/><circle cx="103" cy="1181" r="23" fill="#00866f"/><text x="103" y="1189" font-size="23" fill="white" style="fill:white" font-weight="700" text-anchor="middle">7</text><text x="142" y="1180" font-size="27" font-weight="700">原厂启动器与 Android 双重核验</text><text x="142" y="1216" font-size="23" fill="#536580" style="fill:#536580">Fastboot：unlocked=yes / secure=no</text><text x="142" y="1249" font-size="23" fill="#536580" style="fill:#536580">Android：flash.locked=0 / verifiedboot=orange</text></g><g data-card="早期试过的 FACTFACT" data-box="1120,235,420,169"><rect x="1120" y="235" width="420" height="169" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M1123 257V382" stroke="#b76c0b" stroke-width="6" stroke-linecap="round"/><text x="1145" y="277" font-size="25" font-weight="700">早期试过的 FACTFACT</text><text x="1145" y="313" font-size="22" fill="#536580" style="fill:#536580">可以进入原厂诊断</text><text x="1145" y="346" font-size="22" fill="#536580" style="fill:#536580">但 ADB 仍未授权</text><text x="1145" y="379" font-size="22" fill="#536580" style="fill:#536580">没有靠它取得可用 root</text></g><g data-card="root 与 BL 是两层权限" data-box="1120,455,420,198"><rect x="1120" y="455" width="420" height="198" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M1123 477V631" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><text x="1145" y="497" font-size="25" font-weight="700">root 与 BL 是两层权限</text><text x="1145" y="533" font-size="22" fill="#536580" style="fill:#536580">root：控制已启动的系统</text><text x="1145" y="566" font-size="22" fill="#536580" style="fill:#536580">BL：控制启动镜像的锁状态</text><text x="1145" y="599" font-size="22" fill="#536580" style="fill:#536580">本机先取得 root，再解锁 BL</text><text x="1145" y="632" font-size="22" fill="#536580" style="fill:#536580">进入 Fastboot 本身不等于解锁</text></g><g data-card="为何锁着也能先装面具" data-box="1120,715,420,165"><rect x="1120" y="715" width="420" height="165" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M1123 737V858" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><text x="1145" y="757" font-size="25" font-weight="700">为何锁着也能先装面具</text><text x="1145" y="793" font-size="22" fill="#536580" style="fill:#536580">本机接受测试证书签名</text><text x="1145" y="826" font-size="22" fill="#536580" style="fill:#536580">的修改 boot；还需处理</text><text x="1145" y="859" font-size="22" fill="#536580" style="fill:#536580">AVB1 签名兼容性</text></g><g data-card="HACC 做了什么" data-box="1120,940,420,165"><rect x="1120" y="940" width="420" height="165" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M1123 962V1083" stroke="#00866f" stroke-width="6" stroke-linecap="round"/><text x="1145" y="982" font-size="25" font-weight="700">HACC 做了什么</text><text x="1145" y="1018" font-size="22" fill="#536580" style="fill:#536580">没有导出硬件密钥</text><text x="1145" y="1051" font-size="22" fill="#536580" style="fill:#536580">让本机硬件计算有效校验</text><text x="1145" y="1084" font-size="22" fill="#536580" style="fill:#536580">原厂 LK 因而接受解锁配置</text></g><g data-card="保留独立 USB 救援" data-box="1120,1160,420,125"><rect x="1120" y="1160" width="420" height="125" rx="18" fill="white" stroke="#ccd8e6" stroke-width="1.5"/><path d="M1123 1182V1263" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/><text x="1145" y="1202" font-size="25" font-weight="700">保留独立 USB 救援</text><text x="1145" y="1238" font-size="22" fill="#536580" style="fill:#536580">FASTBOOT → 救援 Recovery</text><text x="1145" y="1271" font-size="22" fill="#536580" style="fill:#536580">不依赖正常 boot，仍依赖 LK</text></g><text x="64" y="1340" font-size="25">USB 负责早期入口和救援；日常通过 Wi-Fi 维护，设备仍由原装电源供电。</text><text x="64" y="1385" font-size="21" fill="#536580" style="fill:#536580">范围说明：BL 解锁没有关闭芯片全部信任链，也未验证任意系统镜像可启动。</text></svg>